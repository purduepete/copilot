<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Open GitHub Items</title><style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;}
*{box-sizing:border-box;}body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text);padding:24px;}
h1{margin:0 0 4px;font-size:22px;}.meta{color:var(--muted);font-size:13px;margin-bottom:18px;}.controls{margin-bottom:14px;}
#search{padding:8px 12px;width:340px;max-width:100%;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px;}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:top;}
th{background:#1c2128;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px;position:sticky;top:0;}
tr.group.repo td{background:#1c2128;font-weight:700;color:var(--accent);font-size:14px;}
tr:hover td{background:#1f262e;}td.id a{color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums;}
a{color:var(--accent);text-decoration:none;}a:hover{text-decoration:underline;}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block;background:#30363d;color:#c9d1d9;margin:1px 2px 1px 0;}
.empty{color:var(--muted);padding:24px 4px;font-size:15px;}
</style></head><body>
<h1>Open GitHub Items</h1>
<div class='meta'>Assigned to @purduepete &bull; Owner: purduepete &bull; Grouped by repo &bull; Sorted by number &bull; Generated: 2026-06-25 11:57 &bull; Total: 0</div>
<div class='empty'>&#127881; No open items. You're all caught up.</div>
</body></html>
